name: VESC Express
version: "1.0.0"
slug: vesc_express
description: Liest Akkuspannung, Ladestand, ESC- und Motortemperatur über den VESC Express aus
url: https://github.com/Jannik44/ha-vesc
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
services:
  - mqtt:want
options:
  host: 192.168.0.119
  port: 65102
  can_id: -1
  cell_count: 20
  scan_interval: 60
schema:
  host: str
  port: port
  can_id: int(-1,254)
  cell_count: int(1,40)
  scan_interval: int(5,86400)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
